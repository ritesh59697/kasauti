[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
hardfork = "base:Cobalt"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "../config" }, { access = "read", path = "../deployments" }, { access = "write", path = "../evidence" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fuzz]
runs = 64
